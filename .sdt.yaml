project: sdt_44f24890
group: sdt_44f24890
# skipDirs — globs pruned from the working tree, relative to this file.
# Declaring a list REPLACES the defaults below, it does not extend them.
# Unset means: .git, .hg, .svn, node_modules, .venv
# skipDirs:
#   - dist
#   - .next
gate:
  - name: 'format'
    run: 'sh scripts/verify.sh fmt'
  - name: 'modules'
    run: 'sh scripts/verify.sh modules'
  - name: 'entry-metadata'
    run: 'task verify:vars'
  - name: 'build'
    run: 'sh scripts/verify.sh build'
  - name: 'vet'
    run: 'sh scripts/verify.sh vet'
  - name: 'lint'
    run: 'sh scripts/verify.sh lint'
  - name: 'test'
    run: 'sh scripts/verify.sh test && sh scripts/verify.sh coverage'
  - name: 'web'
    run: 'cd web && bun run lint && bun run fmt:check && bun run test && bun run build'
  - name: 'govulncheck'
    run: 'sh scripts/verify.sh vuln'
  - name: 'gosec'
    run: 'gosec -quiet -severity medium -exclude-dir=context ./cli/... ./internal/... ./viewer/...'
  - name: 'trivy'
    run: 'trivy fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --exit-code 1 --skip-version-check --no-progress --skip-dirs node_modules --skip-dirs context --skip-dirs bin .'
instructions:
  profiles: [core, knowledge, ui, vector, slides, mindmap, diagram, browser, security, roles]
  frontmatter: [maturity, warrant, evidence, verified, rigor, objectives, learning]

agent:
  command: ["opencode", "acp"]
  models:
    - "opencode/big-pickle"

delegation:
  max_attempts: 1
  max_duration: 45m
  agents:
    - name: opencode-big-pickle
      command: ["opencode", "acp"]
      model: "opencode/big-pickle"
      roles: [backend]
      capabilities: [file-read, file-write, testing]
      concurrency: 1
      cooldown: 10m