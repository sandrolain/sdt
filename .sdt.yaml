project: sdt_44f24890
group: sdt_44f24890
# skipDirs — globs pruned from the working tree, relative to this file.
# Declaring a list REPLACES the defaults below, it does not extend them.
# Unset means: .git, .hg, .svn, node_modules, .venv
# skipDirs:
#   - dist
#   - .next
gate:
  - name: 'delivery'
    run: 'sh scripts/verify-delivery.sh'
instructions:
  profiles: [core, knowledge, ui, vector, slides, mindmap, diagram, browser, security, roles]
  frontmatter: [maturity, warrant, evidence, verified, rigor, objectives, learning, privacy]

agent:
  command: ["opencode", "acp"]
  models:
    - "opencode/big-pickle"

delegation:
  max_attempts: 2
  max_duration: 45m
  trace: true
  agents:
    - name: opencode-deepseek
      command: ["opencode", "acp"]
      model: "opencode/deepseek-v4.1-flash-free"
      roles: [backend]
      capabilities: [file-read, file-write, testing]
      concurrency: 1
      cooldown: 10m
    - name: copilot-luna
      command: ["copilot", "--acp"]
      model: "gpt-6-luna"
      roles: [backend]
      capabilities: [file-read, file-write, testing]
      concurrency: 1
      cooldown: 10m