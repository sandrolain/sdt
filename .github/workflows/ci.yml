name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: sh scripts/verify.sh test

      - name: Enforce package coverage floors
        run: sh scripts/verify.sh coverage

      - name: Verify Go formatting, modules, vet and builds
        run: |
          sh scripts/verify.sh fmt
          sh scripts/verify.sh modules
          sh scripts/verify.sh vet
          sh scripts/verify.sh build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve product scope
        id: scope
        run: echo "packages=$(sh scripts/verify.sh lint-packages | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          args: --timeout=5m ${{ steps.scope.outputs.packages }}

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Declared once, in .tool-versions; a second number here is the drift
          # decision F3 removed.
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, web]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify ldflags targets (D4 guard)
        run: |
          for f in main.go cli/main.go viewer/main.go; do
            for v in version commit date; do
              grep -Eq "^[[:space:]]*${v}[[:space:]]*=" "$f" || { echo "FAIL: -X main.${v} target is not declared in $f"; exit 1; }
            done
          done

      - name: Build CLI
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/sdt ./cli

      - name: Test binary
        run: ./bin/sdt version

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdt-binary-${{ runner.os }}
          path: bin/sdt
          retention-days: 7
